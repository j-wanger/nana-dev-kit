[package]
name = "nana-harness"
version = "0.1.0"
description = "Nana GUI Dev-Harness"
authors = ["Jake Wang"]
edition = "2021"
rust-version = "1.77"

# The Rust shell stays deliberately thin: it owns the window, the strict CSP,
# the capability manifest, and (T2) keyring-rs key custody. The agent engine
# runs in the app's TS/Node layer behind the EngineAdapter; the shell does not
# embed the loop.
[lib]
name = "nana_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Key custody (T2): API keys live only in the OS keychain, never a plaintext
# file. apple-native = macOS Keychain backend (macOS-first per the spec). The
# round-trip is proven empirically by src-tauri/keyhelper against this same crate.
keyring = { version = "3", features = ["apple-native"] }
# Workspace picker (Phase 114, T3): the native folder dialog is opened from RUST
# (the `pick_workspace` command), never from the webview. A Rust-side call bypasses
# the webview ACL, so the renderer is granted NO dialog capability — it can only
# invoke `pick_workspace`, which takes no path argument (it cannot relocate the
# gate root). The chosen folder becomes the re-spawned sidecar's NANA_WORKSPACE (T4).
tauri-plugin-dialog = "2"

[features]
# this feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
